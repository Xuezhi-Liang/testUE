<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>86 张地图 · UE 路线验证</title>
<style>@font-face{font-family:LocalChinese;src:url(chinese.woff2)}*{box-sizing:border-box}body{margin:0;background:#0a121e;color:#dae5f2;font:15px/1.7 LocalChinese,system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:30px 22px}h1{font-size:30px;margin-bottom:8px}a{color:#79dcdf}p,small{color:#aabbce}.bar{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#142334;padding:16px 24px;border-radius:12px;min-width:145px}.stat b{font-size:29px;display:block;color:#fff}input,select{font:inherit;background:#142334;color:white;padding:10px;border:1px solid #36516d;border-radius:7px;margin:18px 8px 18px 0}input{min-width:270px}.card{background:#101e2e;border:1px solid #26384d;border-radius:12px;padding:18px;margin:14px 0;overflow:hidden}.name{font-weight:650;font-size:17px;overflow-wrap:anywhere}.badge{display:inline-block;padding:3px 10px;border-radius:20px;background:#33465f;font-size:13px;margin-bottom:8px}.geometry_pass{background:#185b51}.coverage_review,.route_failed,.timeout{background:#705224}.failed,.blocked_asset{background:#743d43}.running,.starting{background:#294f85}.metrics{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0}.metrics strong{display:block;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 monospace;background:#091321;padding:12px;max-height:240px;overflow:auto}img{display:block;width:100%;max-width:820px;margin:12px auto;border-radius:8px}#live{border-left:3px solid #65d5cc;padding:10px 16px;background:#112335}details{margin-top:10px}nav{display:flex;gap:16px;flex-wrap:wrap}.error{color:#ffb8aa}@media(max-width:600px){main{padding:18px 12px}h1{font-size:24px}.stat{min-width:0;flex:1;padding:12px}input{width:100%;min-width:0}.metrics{gap:12px}.card{padding:14px}}</style>
<main><nav><a href="../route-audit/">86 张路线审查图</a><a href="../general-stability-more/">画质方案对比</a><a href="/dubai/?view=first">Dubai 与原有结果</a></nav><h1>86 张地图 · UE 路线验证</h1><p>逐张启动本机 UE，生成完整路线，检查逐帧身体碰撞与近角点，抽查深度画面。结果每 5 秒更新，原路线和视频保留。</p><div class="bar" id="stats"></div><p id="live">正在读取队列…</p><p id="eta">首批地图完成后，按实测耗时更新剩余时间估算。</p><p>“预检通过”只代表当前路线通过检查，仍需确认主体街区覆盖和短视频画质。路网保留率以所选区域的原始路网为分母，不代表全地图覆盖率。灰底是本次 UE 导出的导航网，青线是规划路线，黄点为起点。</p><input id="search" placeholder="搜索地图名称"><select id="filter"><option value="all">全部地图</option><option value="active">正在验证</option><option value="done">已有结果</option><option value="review">需要处理</option><option value="queued">等待中</option></select><small id="updated"></small><div id="rows"></div></main>
<script>
const names={queued:'等待验证',starting:'启动 UE',connecting:'连接 UE',running:'验证中',geometry_pass:'路线预检通过 · 待画面验收',coverage_review:'预检通过 · 路网损失待复查',route_failed:'路线预检未通过',failed:'验证执行失败',blocked_asset:'缺少地图资产',timeout:'验证超时',interrupted:'已中断'},terminal=['geometry_pass','coverage_review','route_failed','failed','blocked_asset','timeout'];let data;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pct=x=>Number.isFinite(x)?(x*100).toFixed(1)+'%':'—',mins=x=>Number.isFinite(x)?(x/60).toFixed(1)+' 分钟':'—';
function render(){if(!data)return;let c=data.counts;document.querySelector('#stats').innerHTML=[['已出结果',data.completed+' / '+data.total],['预检通过',(c.geometry_pass||0)+(c.coverage_review||0)],['需处理',(c.coverage_review||0)+(c.route_failed||0)+(c.failed||0)+(c.timeout||0)+(c.blocked_asset||0)]].map(([k,v])=>`<div class="stat">${esc(k)}<b>${esc(v)}</b></div>`).join('');let q=data.queue;document.querySelector('#eta').textContent=q.eta_sample_maps?'已完成计时样本 '+q.eta_sample_maps+' 张，平均每张 '+mins(q.mean_map_s)+'；按此速度粗估剩余 '+q.rough_remaining_h.toFixed(1)+' 小时。不同地图耗时差异大，不含后续修复、补录和画质验收。':'首批地图完成后，按实测耗时更新剩余时间估算。';let a=data.rows.find(r=>r.slug===q.active);document.querySelector('#live').textContent=q.state==='running'&&q.heartbeat_age_s>60?'队列心跳已过期，请检查运行状态':a?'当前：'+a.slug.replace('Game_','')+' · '+(a.phase||names[a.state]):q.state==='finished'?'本轮队列结束':'队列状态：'+(q.state||'等待启动');document.querySelector('#updated').textContent='更新于 '+new Date(data.updated_epoch*1000).toLocaleTimeString();let term=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value,selected=data.rows.filter(r=>r.slug.toLowerCase().includes(term)&&(f==='all'||f==='done'&&terminal.includes(r.state)||f==='active'&&['starting','connecting','running'].includes(r.state)||f==='queued'&&r.state==='queued'||f==='review'&&terminal.includes(r.state)&&r.state!=='geometry_pass')),open=new Set([...document.querySelectorAll('details[open]')].map(n=>n.id));document.querySelector('#rows').innerHTML=selected.map(r=>{let a=r.latest||{},fail=a.failed_gates||[];return `<article class="card" id="${esc(r.slug)}"><span class="badge ${esc(r.state)}">${esc(names[r.state]||r.state)}</span><div class="name">${esc(r.slug.replace('Game_',''))}</div><p>${esc(r.audit_review)}</p><div class="metrics"><span>路网保留率<strong>${pct(a.kept_fraction)}</strong></span><span>规划路线时长<strong>${mins(a.duration_s)}</strong></span><span>本次实际验证耗时<strong>${mins(r.total_elapsed_s??r.elapsed_s)}</strong></span><span>区域选择<strong>${r.policy==='content_region'?'优先主体区域（启发式）':'最长路网区域'}</strong></span></div>${r.retry_history?.length?'<p>历史尝试已保留 '+r.retry_history.length+' 次；本次使用修正后的启动等待与请求超时检查。</p>':''}${r.ground_clearance_cm!==6?'<small>沿用该地图历史净空参数 '+esc(r.ground_clearance_cm)+' cm；其他地图默认 6 cm。</small>':''}${fail.length?'<p class="error">未通过：'+esc(fail.join('、'))+'</p>':''}${r.error||a.error?'<p class="error">'+esc(r.error||a.error)+'</p>':''}${r.plot?`<details id="plot-${esc(r.slug)}" ${open.has('plot-'+r.slug)?'open':''}><summary>查看本次路线图</summary><img loading="lazy" src="${esc(r.plot)}" alt="本次路线与导航网"></details>`:''}${r.report?'<a href="'+esc(r.report)+'" target="_blank">检查报告 JSON</a> · ':''}<a href="../route-audit/#${esc(r.slug)}">历史路线审查</a>${r.log_tail?`<details id="log-${esc(r.slug)}" ${open.has('log-'+r.slug)?'open':''}><summary>验证日志</summary><pre>${esc(r.log_tail)}</pre></details>`:''}</article>`}).join('')}
async function refresh(){try{let r=await fetch('status.json?t='+Date.now());if(!r.ok)throw Error(r.status);data=await r.json();render()}catch(e){document.querySelector('#live').textContent='状态读取失败：'+e.message}}document.querySelector('#search').addEventListener('input',render);document.querySelector('#filter').addEventListener('change',render);refresh();setInterval(refresh,5000);
</script></html>
